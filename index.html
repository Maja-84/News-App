<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Tagesübersicht</title>
<meta name="description" content="Marias tägliche Nachrichten: Schweiz, Welt, KI & Technologie">
<meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131920" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="News">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div>
      <div class="eyebrow">Tagesübersicht</div>
      <h1 id="ausgabe">Wird geladen …</h1>
    </div>
    <div class="actions">
      <button id="refresh" class="icon-btn" aria-label="Aktualisieren" title="Aktualisieren">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="theme" class="icon-btn" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </div>
  <nav class="segments" role="tablist" id="tabs"></nav>
</header>
<div id="offline" class="notice" hidden>Offline – du siehst die zuletzt gespeicherte Ausgabe.</div>
<div id="ptr" class="ptr" aria-hidden="true">Loslassen zum Aktualisieren</div>
<main id="content" aria-live="polite"></main>
<div id="install" class="install" hidden>
  <div id="install-text">Als App auf dem Homescreen speichern?</div>
  <div class="install-actions">
    <button id="install-btn" class="btn primary" hidden>Installieren</button>
    <button id="install-close" class="btn">Später</button>
  </div>
</div>
<audio id="audio" preload="auto" playsinline></audio>
<div id="sheet" class="sheet" hidden role="dialog" aria-label="Wiedergabeliste"></div>
<div id="player" class="player" hidden></div>
<script src="./player.js"></script>
<script src="./app.js"></script>
</body>
</html>
